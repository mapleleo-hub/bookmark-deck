<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新标签页</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="wall"></div>

<div class="app">
  <aside class="rail" id="rail">
    <div class="rail-brand">
      <span class="dot"></span>
      <span class="rail-label" id="brandText">书签</span>
      <button class="rail-toggle" id="railToggle" title="收起侧栏">‹</button>
    </div>
    <nav class="pages" id="pages"></nav>
    <button class="page add" id="addPage" title="新建分页">
      <span class="av plus">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </span>
      <span class="label">新建分页</span>
    </button>
  </aside>

  <div class="main">
    <header class="top">
      <div class="clock" id="clock"></div>
      <div class="search-wrap">
        <div class="search">
          <button type="button" class="engine" id="engineBtn" title="选择搜索源">
            <span id="engineName">书签与标签</span>
            <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="search-sep"></span>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="q" type="search" placeholder="搜索，Ctrl+K" autocomplete="off" spellcheck="false">
        </div>
        <div class="finder" id="finder" hidden>
          <div class="finder-list" id="flist"></div>
          <div class="palette-foot"><span id="fcount"></span><span>↑↓ 选择 · Enter 打开 · Esc 关闭</span></div>
        </div>
      </div>
    </header>
    <main class="grid" id="grid"></main>
  </div>
</div>

<section class="overlay" id="overlay" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <div class="crumbs" id="crumbs"></div>
      <button class="icon-btn" id="closeOverlay" title="关闭">×</button>
    </div>
    <div class="grid" id="subgrid"></div>
  </div>
</section>

<section class="palette" id="palette" hidden>
  <div class="palette-box">
    <div class="palette-head">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="pq" placeholder="搜索标签与书签" autocomplete="off" spellcheck="false">
      <button class="icon-btn" id="closePalette" title="关闭">×</button>
    </div>
    <div class="palette-list" id="plist"></div>
    <div class="palette-foot"><span id="pcount"></span><span>↑↓ 选择 · Enter 打开 · Esc 关闭</span></div>
  </div>
</section>

<div class="menu" id="menu" hidden></div>

<div class="modal" id="modal" hidden>
  <form class="box" id="form">
    <h3 id="formTitle">添加书签</h3>
    <label>名称<input id="fName" required maxlength="200"></label>
    <label>网址<input id="fUrl" placeholder="https://" autocomplete="off"></label>
    <p class="err" id="fErr" hidden></p>
    <div class="row">
      <button type="button" class="ghost" id="fCancel">取消</button>
      <button type="submit" class="primary" id="fOk">保存</button>
    </div>
  </form>
</div>

<aside class="drawer" id="drawer" hidden>
  <div class="sheet-head">
    <h3>设置</h3>
    <button class="icon-btn" id="closeDrawer" title="关闭">×</button>
  </div>
  <div class="field">
    <span class="label">主题</span>
    <div class="seg" id="themeSeg">
      <button data-theme="auto">跟随壁纸</button><button data-theme="light">浅色</button><button data-theme="dark">深色</button>
    </div>
  </div>
  <div class="field">
    <span class="label">主题色</span>
    <div class="accents" id="accentRow"></div>
  </div>
  <div class="field">
    <span class="label">壁纸</span>
    <div class="swatches" id="swatches"></div>
    <div class="row gap">
      <button class="ghost" id="pickImage">选本地图片</button>
      <button class="ghost" id="clearImage">清除</button>
    </div>
    <input type="file" id="fileImage" accept="image/*" hidden>
  </div>
  <div class="field">
    <span class="label">布局</span>
    <div class="seg" id="layoutSeg">
      <button data-layout="grid">网格</button><button data-layout="free">自由摆放</button>
    </div>
    <p class="note">自由摆放的坐标存在本机，不随书签同步；拖一个图标压到另一个图标上会新建文件夹把两者收进去。</p>
  </div>
  <div class="field">
    <span class="label">图标大小</span>
    <div class="seg" id="sizeSeg">
      <button data-size="s">小</button><button data-size="m">中</button><button data-size="l">大</button>
    </div>
  </div>
  <div class="field">
    <label class="inline"><input type="checkbox" id="showEmpty"> 显示空分页</label>
  </div>
  <div class="field" id="devBlock" hidden>
    <span class="label">开发</span>
    <div class="row gap">
      <button class="ghost" id="reloadExt">重载扩展</button>
      <span class="note" style="align-self:center">改完代码点它，再按 F5</span>
    </div>
  </div>
  <div class="field">
    <span class="label">书签来源</span>
    <div class="seg" id="rootSeg"></div>
    <p class="note">换源后仍读写同一份书签，只是显示哪个根目录。</p>
  </div>
</aside>

<div class="fab">
  <button class="icon-btn big" id="addFolderBtn" title="新建文件夹">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3.5 6.5a2 2 0 0 1 2-2h3.6l1.8 2h7.6a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 11v4M10 13h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
  </button>
  <button class="icon-btn big" id="addBtn" title="添加书签">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <button class="icon-btn big" id="gearBtn" title="设置">
    <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.65 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64zM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5z"/></svg>
  </button>
</div>

<div class="toast" id="toast" hidden></div>

<script src="demo.js"></script>
<script src="app.js"></script>
</body>
</html>
